# ═══════════════════════════════════════════════════════════════════════════════
# REUSABLE WORKFLOW: .NET Quality Gate
# Build + Test (+ optional lint) para qualquer microsserviço .NET da org Healsyn.
# ═══════════════════════════════════════════════════════════════════════════════
name: 🔄 .NET Quality Gate (reusable)

# Cada serviço mantém somente a validação mais recente da mesma branch. O
# prefixo exclusivo deste workflow evita cancelar o Security Gate paralelo.
concurrency:
  group: dotnet-quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: "Versão do .NET SDK (ex: '10.0.x')"
        type: string
        default: '10.0.x'
      solution-file:
        description: "Caminho do .sln ou .csproj a ser buildado"
        type: string
        required: true
      run-format-check:
        description: "Bloquear o gate se 'dotnet format --verify-no-changes' falhar"
        type: boolean
        default: false
      configuration:
        description: "Build configuration"
        type: string
        default: 'Release'

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 📥 Restore dependencies
        env:
          SOLUTION_FILE: ${{ inputs.solution-file }}
        run: dotnet restore "$SOLUTION_FILE"

      - name: 🏗️ Build
        env:
          SOLUTION_FILE: ${{ inputs.solution-file }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet build "$SOLUTION_FILE" --no-restore --configuration "$CONFIGURATION"

      - name: 🧪 Run Unit Tests
        env:
          SOLUTION_FILE: ${{ inputs.solution-file }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: dotnet test "$SOLUTION_FILE" --no-build --configuration "$CONFIGURATION" --verbosity normal

  linting:
    name: 🔍 Linting
    if: ${{ inputs.run-format-check }}
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 📥 Restore dependencies
        env:
          SOLUTION_FILE: ${{ inputs.solution-file }}
        run: dotnet restore "$SOLUTION_FILE"

      - name: 🔍 Run .NET Format Check
        env:
          SOLUTION_FILE: ${{ inputs.solution-file }}
        run: dotnet format "$SOLUTION_FILE" --verify-no-changes --verbosity diagnostic

  quality-gate:
    name: ✅ Quality Gate
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    needs: [build-and-test, linting]
    if: always()
    steps:
      - name: 📊 Check Quality Gate Status
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          LINT_RESULT: ${{ needs.linting.result }}
          RUN_FORMAT_CHECK: ${{ inputs.run-format-check }}
        run: |
          echo "📊 Quality Gate Results:"
          echo "  Build & Test: ${BUILD_RESULT}"
          echo "  Linting:      ${LINT_RESULT}"
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "❌ Build and Tests failed"
            exit 1
          fi
          if [ "${RUN_FORMAT_CHECK}" = "true" ] && [ "${LINT_RESULT}" != "success" ]; then
            echo "❌ Linting failed"
            exit 1
          fi
          echo "✅ Quality Gate passed!"
