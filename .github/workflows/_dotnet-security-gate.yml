# ═══════════════════════════════════════════════════════════════════════════════
# REUSABLE WORKFLOW: .NET Security Gate
# Multi-camadas: SAST/SCA (Semgrep) + Container Scan (Trivy) +
# Dependency Vuln Check (dotnet list package).
#
# GitLeaks está temporariamente desabilitado enquanto a licença da organização
# é configurada. Reativar o job secret-detection e o bloqueio correspondente
# no security-gate após definir o secret GITLEAKS_LICENSE.
#
# Política fail-closed (P0-4): GitLeaks e Semgrep são bloqueantes. O job
# security-gate falha se secret-detection, semgrep ou container-scan != success.
# Soft (intencional, documentado): upload SARIF; findings Trivy (exit-code 0);
# dependency-scan (warning). Não reintroduzir continue-on-error nos scans.
# ═══════════════════════════════════════════════════════════════════════════════
name: 🔒 .NET Security Gate (reusable)

# Cancela scans de commits ultrapassados do mesmo serviço/branch, sem
# interferir no Quality Gate chamado em paralelo pelo pipeline do serviço.
concurrency:
  group: dotnet-security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        default: '10.0.x'
      solution-file:
        type: string
        required: true
      service-name:
        description: "Nome do serviço (usado como image tag)"
        type: string
        required: true
      dockerfile:
        type: string
        default: 'Dockerfile'
      semgrep-version:
        type: string
        default: '1.161.0'
      trivy-version:
        type: string
        default: 'v0.36.0'
    secrets:
      GITLEAKS_LICENSE:
        required: false
        description: >
          Licença GitLeaks (secret de org/repo; nunca no git). Chamadores
          devem passar via secrets: inherit. Sem a licença em organização
          GitHub, o action falha e o gate bloqueia (fail-closed).

jobs:
  semgrep:
    name: 🔍 Semgrep SAST/SCA
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Run Semgrep (Full Scan)
        uses: docker://semgrep/semgrep:1.161.0
        with:
          args: >-
            semgrep
            --config=p/csharp
            --config=p/owasp-top-ten
            --config=p/security-audit
            --config=p/secrets
            --config=p/supply-chain
            --config=p/cwe-top-25
            --sarif
            --output=semgrep.sarif
            --metrics=off
            --error
            --severity=ERROR
            --severity=WARNING

      - name: 📤 Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        # Soft intencional: reporting. GHAS/Code Scanning pode estar
        # indisponível no repo chamador; não mascara o resultado do scan.
        continue-on-error: true

  container-scan:
    name: 🐳 Container Scan
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐳 Build Docker image for scanning
        # No cluster atual, o cache remoto de BuildKit custou mais tempo de
        # transferência do que economizou. O Docker-in-Docker persistente dos
        # runners já mantém cache local entre jobs no mesmo runner.
        run: docker build -t ${{ inputs.service-name }}:scan -f ${{ inputs.dockerfile }} .

      - name: 🔍 Run Trivy (SARIF for Code Scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false

      - name: 📤 Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container
        # Soft intencional: reporting. Mesma política do upload Semgrep.
        continue-on-error: true

      - name: 📊 Run Trivy (table summary in logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:scan
          format: 'table'
          # Soft intencional: findings CRITICAL/HIGH não falham o step.
          # Falha de build Docker ou do scanner (action) continua bloqueante.
          # Promover para exit-code 1 exige baseline/ignore por serviço.
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false

  dependency-scan:
    name: 📦 Dependency Scan
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-security-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-security-

      - name: 📦 Restore dependencies
        run: dotnet restore ${{ inputs.solution-file }}

      - name: 🔍 Check for vulnerable packages
        run: |
          echo "🔍 Checking for vulnerable packages..."
          dotnet list ${{ inputs.solution-file }} package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::warning::Vulnerable packages detected (advisory; não bloqueia o security-gate)"
          else
            echo "✅ No vulnerable packages found"
          fi

  security-gate:
    name: 🔒 Security Gate
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    needs: [semgrep, container-scan, dependency-scan]
    if: always()
    steps:
      - name: 🔒 Check Security Gate Status
        env:
          SEMGREP: ${{ needs.semgrep.result }}
          CONTAINER_SCAN: ${{ needs.container-scan.result }}
          DEPENDENCY_SCAN: ${{ needs.dependency-scan.result }}
        run: |
          echo "🔒 Security Gate Results:"
          echo "  Semgrep:          ${SEMGREP} (bloqueante)"
          echo "  Container Scan:   ${CONTAINER_SCAN} (bloqueante: build/scanner)"
          echo "  Dependency Scan:  ${DEPENDENCY_SCAN} (advisory; não bloqueia)"
          failed=0
          if [ "${SEMGREP}" != "success" ]; then
            echo "❌ Semgrep SAST/SCA failed"
            failed=1
          fi
          if [ "${CONTAINER_SCAN}" != "success" ]; then
            echo "❌ Container Scan failed (build error or scanner failure)"
            failed=1
          fi
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "✅ Security Gate passed!"
