# ═══════════════════════════════════════════════════════════════════════════════
# REUSABLE WORKFLOW: .NET Security Gate
# Multi-camadas: Secret Detection (GitLeaks) + SAST/SCA (Semgrep) +
# Container Scan (Trivy) + Dependency Vuln Check (dotnet list package).
# ═══════════════════════════════════════════════════════════════════════════════
name: 🔒 .NET Security Gate (reusable)

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        default: '10.0.x'
      solution-file:
        type: string
        required: true
      service-name:
        description: "Nome do serviço (usado como image tag)"
        type: string
        required: true
      dockerfile:
        type: string
        default: 'Dockerfile'
      semgrep-version:
        type: string
        default: '1.161.0'
      trivy-version:
        type: string
        default: 'v0.36.0'

jobs:
  secret-detection:
    name: 🔑 Secret Detection
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 GitLeaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  semgrep:
    name: 🔍 Semgrep SAST/SCA
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔍 Run Semgrep (Full Scan)
        uses: docker://semgrep/semgrep:1.161.0
        with:
          args: >-
            semgrep
            --config=p/csharp
            --config=p/owasp-top-ten
            --config=p/security-audit
            --config=p/secrets
            --config=p/supply-chain
            --config=p/cwe-top-25
            --sarif
            --output=semgrep.sarif
            --metrics=off
            --error
            --severity=ERROR
            --severity=WARNING
        continue-on-error: true

      - name: 📤 Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  container-scan:
    name: 🐳 Container Scan
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    permissions:
      security-events: write
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐳 Build Docker image for scanning
        run: docker build -t ${{ inputs.service-name }}:scan -f ${{ inputs.dockerfile }} .

      - name: 🔍 Run Trivy (SARIF for Code Scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false

      - name: 📤 Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container
        continue-on-error: true

      - name: 📊 Run Trivy (table summary in logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.service-name }}:scan
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false

  dependency-scan:
    name: 📦 Dependency Scan
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 📦 Restore dependencies
        run: dotnet restore ${{ inputs.solution-file }}

      - name: 🔍 Check for vulnerable packages
        run: |
          echo "🔍 Checking for vulnerable packages..."
          dotnet list ${{ inputs.solution-file }} package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::warning::Vulnerable packages detected"
          else
            echo "✅ No vulnerable packages found"
          fi

  security-gate:
    name: 🔒 Security Gate
    runs-on:
      - self-hosted
      - org
      - k8s
      - linux
    needs: [secret-detection, semgrep, container-scan, dependency-scan]
    if: always()
    steps:
      - name: 🔒 Check Security Gate Status
        run: |
          echo "🔒 Security Gate Results:"
          echo "  Secret Detection: ${{ needs.secret-detection.result }}"
          echo "  Semgrep:          ${{ needs.semgrep.result }}"
          echo "  Container Scan:   ${{ needs.container-scan.result }}"
          echo "  Dependency Scan:  ${{ needs.dependency-scan.result }}"
          if [ "${{ needs.container-scan.result }}" != "success" ]; then
            echo "❌ Container Scan failed (build error or critical vulns)"
            exit 1
          fi
          echo "✅ Security Gate passed!"
